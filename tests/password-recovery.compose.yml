# Pile isolée pour les tests HTTP/SMTP. Aucun envoi de mail externe.
services:
  postgres:
    image: postgres:17
    environment: {POSTGRES_DB: recovery, POSTGRES_USER: recovery, POSTGRES_PASSWORD: test-only-password}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U recovery -d recovery]
      interval: 2s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.29
    ports: ['127.0.0.1:18025:8025']
  smtp:
    image: boky/postfix:5.1.0
    environment:
      RELAYHOST: '[mailpit]:1025'
      ALLOWED_SENDER_DOMAINS: example.test
      POSTFIX_smtp_tls_security_level: none
      POSTFIX_mynetworks: 172.30.41.0/24
      POSTFIX_smtpd_recipient_restrictions: permit_mynetworks, reject_unauth_destination
    depends_on: [mailpit]
  web-tcg:
    image: ${TEST_APP_IMAGE:-worlds-tcg:verification}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Host: postgres
      Database__Name: recovery
      Database__User: recovery
      Database__Password: test-only-password
      PublicSite__BaseUrl: https://worlds-tcg.com
      Email__Host: smtp
      Email__Port: 587
      Email__FromAddress: no-reply@example.test
    ports: ['127.0.0.1:18085:8080']
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/health]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      postgres: {condition: service_healthy}
      smtp: {condition: service_healthy}
networks:
  default:
    ipam:
      config: [{subnet: 172.30.41.0/24}]
