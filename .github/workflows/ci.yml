name: Vérifications

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Déployer sur le VPS après les vérifications (branche master)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      market-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: checks
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: market_checks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U checks -d market_checks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Vérifier le SDK .NET de la solution
        shell: bash
        run: |
          version=$(dotnet --version)
          echo "SDK sélectionné : $version"
          [[ "$version" == 10.0.* ]]
      - run: node --test .github/scripts/release.test.mjs .github/scripts/prepare-deploy.test.mjs tests/frontend-regressions.test.cjs tests/friends-pagination.test.cjs tests/inventory-discard.test.cjs tests/popup-confirmation.test.cjs tests/friend-duel.test.cjs tests/booster-sounds.test.cjs
      - run: dotnet run --project tests/RegressionChecks/RegressionChecks.csproj -p:NuGetAudit=false
      - name: Vérifier les enchères concurrentes et les transferts
        env:
          TCG_MARKET_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=market_checks;Username=checks;Password=test-password
        run: dotnet run --project tests/RegressionChecks/RegressionChecks.csproj --no-build -- --market
      - name: Friends and trades regression checks
        env:
          TCG_FRIENDS_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=market_checks;Username=checks;Password=test-password
        run: dotnet run --project tests/RegressionChecks/RegressionChecks.csproj --no-build -- --friends
      - name: Vérifier les invitations en duel entre amis
        env:
          TCG_FRIENDS_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=market_checks;Username=checks;Password=test-password
        run: dotnet run --project tests/RegressionChecks/RegressionChecks.csproj --no-build -- --duels
      - name: Vérifier les monnaies entières et leur migration
        env:
          TCG_MARKET_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=market_checks;Username=checks;Password=test-password
        run: dotnet run --project tests/RegressionChecks/RegressionChecks.csproj --no-build -- --currency
      - name: Vérifier l'inventaire et la défausse
        env:
          TCG_MARKET_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=market_checks;Username=checks;Password=test-password
        run: dotnet run --project tests/RegressionChecks/RegressionChecks.csproj --no-build -- --inventory
      - name: Vérifier les statistiques de l’accueil
        env:
          TCG_MARKET_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=market_checks;Username=checks;Password=test-password
        run: dotnet run --project tests/RegressionChecks/RegressionChecks.csproj --no-build -- --home
      - name: Valider Compose sans secrets réels
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet
      - name: Valider la configuration de production sans secrets réels
        run: node tests/deploy-validation.mjs
      - name: Vérifier la migration du réseau Caddy
        run: node tests/proxy-network.integration.mjs
      - name: Construire l'image et le CSS
        run: docker build -f web-tcg/Dockerfile -t worlds-tcg:ci .
      - name: Vérifier la supervision dans une pile isolée
        env:
          TEST_APP_IMAGE: worlds-tcg:ci
        run: node tests/monitoring.integration.mjs
      - name: Parcours HTTP et SMTP dans une pile isolée
        env:
          TEST_APP_IMAGE: worlds-tcg:ci
        run: |
          docker compose -p worlds-tcg-recovery-test -f tests/password-recovery.compose.yml up -d --wait --wait-timeout 240
          node tests/password-recovery.integration.mjs
      - name: Nettoyer la pile de test
        if: always()
        run: docker compose -p worlds-tcg-recovery-test -f tests/password-recovery.compose.yml down -v


  publish:
    needs: checks
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - name: Publier l'image du commit
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          version=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft == false and .published_at != null)] | sort_by(.published_at) | last | .tag_name // "v0.1"')
          docker build --build-arg "APP_VERSION=$version" -f web-tcg/Dockerfile -t "$image" .
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: '24', package-manager-cache: false}
      - name: Préparer la configuration privée
        run: node .github/scripts/prepare-deploy.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ needs.publish.outputs.image }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MONITORING_ENABLED: ${{ vars.MONITORING_ENABLED }}
          GRAFANA_DOMAIN: ${{ vars.GRAFANA_DOMAIN }}
          GRAFANA_ADMIN_USER: ${{ vars.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          POSTGRES_MONITOR_PASSWORD: ${{ secrets.POSTGRES_MONITOR_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          MONITORING_DISCORD_WEBHOOK_URL: ${{ secrets.MONITORING_DISCORD_WEBHOOK_URL }}
      - name: Déployer via SSH avec vérification de la clé du VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ && "${VPS_PORT:-22}" =~ ^[0-9]+$ ]]
          umask 077
          mkdir -p "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$VPS_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          opts=(-i "$RUNNER_TEMP/deploy-ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts")
          ssh "${opts[@]}" -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "mkdir -p /opt/worlds-tcg/releases/$GITHUB_SHA && chmod 700 /opt/worlds-tcg/releases/$GITHUB_SHA"
          scp -r "${opts[@]}" -P "${VPS_PORT:-22}" deployment-bundle/* "$VPS_USER@$VPS_HOST:/opt/worlds-tcg/releases/$GITHUB_SHA/"
          ssh "${opts[@]}" -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "bash /opt/worlds-tcg/releases/$GITHUB_SHA/remote-deploy.sh $GITHUB_SHA $GITHUB_ACTOR"
      - name: Effacer les fichiers temporaires du runner
        if: always()
        run: rm -rf deployment-bundle "$RUNNER_TEMP/deploy-ssh"
