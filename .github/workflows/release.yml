name: Release et Discord

on:
  push:
    tags: ['**']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag existant à publier ou notification à reprendre
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Exécuter le script de la branche de confiance, pas du tag demandé.
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Vérifier la génération des notes et de l'embed
        run: node --test .github/scripts/release.test.mjs
      - name: Publier les notes et notifier Discord
        run: node .github/scripts/release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

