version: 2

updates:
  # Bibliothèques .NET de l'application.
  - package-ecosystem: "nuget"
    directory: "/web-tcg"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      dotnet-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Dépendances JavaScript et construction du CSS.
  - package-ecosystem: "npm"
    directory: "/web-tcg"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Images de base du Dockerfile (.NET et Node.js).
  - package-ecosystem: "docker"
    directory: "/web-tcg"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Images des services Compose : PostgreSQL, Caddy, Mailpit, etc.
  - package-ecosystem: "docker-compose"
    directories: ["/", "/deploy", "/tests"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Actions des workflows de vérification et de publication.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
