services:
  uploads-init:
    # Ce service ne doit pas être détecté comme un deuxième projet .NET par VS.
    image: busybox:1.37.0

    user: "0:0"

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -e

        echo "Initialisation du stockage uploads..."

        mkdir -p /app/wwwroot/uploads/cards
        mkdir -p /app/wwwroot/uploads/avatars
        mkdir -p /home/app/.aspnet/DataProtection-Keys

        APP_USER_ID=$$(id -u app 2>/dev/null || echo 1654)
        APP_GROUP_ID=$$(id -g app 2>/dev/null || echo 1654)

        echo "Utilisateur ASP.NET : $${APP_USER_ID}:$${APP_GROUP_ID}"

        chown -R "$${APP_USER_ID}:$${APP_GROUP_ID}" /app/wwwroot/uploads
        chown -R "$${APP_USER_ID}:$${APP_GROUP_ID}" /home/app/.aspnet/DataProtection-Keys

        chmod -R u+rwX,g+rX /app/wwwroot/uploads

        echo "Stockage uploads initialisé."

    volumes:
      - uploads_data:/app/wwwroot/uploads
      - protection_keys:/home/app/.aspnet/DataProtection-Keys

    restart: "no"

    networks:
      - tcg-network

  web-tcg:
    image: ${DOCKER_REGISTRY-}webtcg:latest

    build:
      context: .
      dockerfile: web-tcg/Dockerfile

    container_name: web-tcg

    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: >-
        Host=postgres;
        Port=5432;
        Database=${POSTGRES_DB:?Définir POSTGRES_DB dans .env};
        Username=${POSTGRES_USER:?Définir POSTGRES_USER dans .env};
        Password=${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}

    ports:
      - "${WEB_PORT:-8080}:8080"

    volumes:
      - uploads_data:/app/wwwroot/uploads
      - protection_keys:/home/app/.aspnet/DataProtection-Keys

    depends_on:
      uploads-init:
        condition: service_completed_successfully

      postgres:
        condition: service_healthy

    networks:
      - tcg-network

  postgres:
    image: postgres:17

    container_name: web-tcg-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Définir POSTGRES_DB dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?Définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - tcg-network

volumes:
  postgres_data:
  uploads_data:
  protection_keys:

networks:
  tcg-network:
    driver: bridge
