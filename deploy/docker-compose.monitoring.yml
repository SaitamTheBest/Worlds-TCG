# Optional overlay, enabled by remote-deploy.sh when MONITORING_ENABLED=true.
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: '3'}
x-monitor: &monitor
  restart: unless-stopped
  logging: *logging
  networks: [monitoring]
services:
  web-tcg:
    environment:
      Monitoring__Enabled: 'true'
    networks: [default, proxy, monitoring]
    logging: *logging
  postgres:
    logging: *logging
  smtp:
    logging: *logging
  caddy:
    environment:
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:?}
    logging: *logging
    depends_on: [grafana]
  grafana:
    <<: *monitor
    image: grafana/grafana:13.3.1
    mem_limit: 256m
    cpus: 0.5
    networks: [monitoring, proxy]
    environment:
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:?}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:?}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_LOG_MODE: console
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:3000/api/health]
      interval: 15s
      timeout: 5s
      retries: 12
  prometheus:
    <<: *monitor
    image: prom/prometheus:v3.16.0
    mem_limit: 320m
    cpus: 0.5
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=7d, --storage.tsdb.retention.size=1GB, --query.max-concurrency=4, --query.max-samples=1000000]
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus:/etc/prometheus:ro
  alertmanager:
    <<: *monitor
    image: prom/alertmanager:v0.35.0
    mem_limit: 64m
    cpus: 0.2
    networks: [monitoring, default]
    command: [--config.file=/etc/alertmanager/config.yml, --storage.path=/alertmanager, --cluster.listen-address=]
    volumes:
      - alertmanager_data:/alertmanager
      - ./monitoring/alertmanager:/etc/alertmanager:ro
  loki:
    <<: *monitor
    image: grafana/loki:3.7.0
    mem_limit: 256m
    cpus: 0.5
    command: [-config.file=/etc/loki/config.yml]
    volumes:
      - loki_data:/loki
      - ./monitoring/loki.yml:/etc/loki/config.yml:ro
  alloy:
    <<: *monitor
    image: grafana/alloy:v1.21.3
    mem_limit: 128m
    cpus: 0.3
    networks: [monitoring, docker-observer]
    command: [run, --storage.path=/var/lib/alloy/data, /etc/alloy/config.alloy]
    volumes:
      - alloy_data:/var/lib/alloy/data
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
    depends_on: [docker-socket-proxy, loki]
  docker-socket-proxy:
    <<: *monitor
    image: tecnativa/docker-socket-proxy:v0.5.0
    mem_limit: 32m
    cpus: 0.2
    networks: [docker-observer]
    environment:
      CONTAINERS: '1'
      NETWORKS: '1'
      INFO: '1'
      VERSION: '1'
      PING: '1'
      POST: '0'
      LOG_LEVEL: warning
    volumes: [/var/run/docker.sock:/var/run/docker.sock:ro]
  cadvisor:
    <<: *monitor
    image: ghcr.io/google/cadvisor:0.60.6
    mem_limit: 128m
    cpus: 0.3
    privileged: true
    cgroup: host
    networks: [monitoring, docker-observer]
    command:
      - --docker=tcp://docker-socket-proxy:2375
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
      - --disable_metrics=advtcp,cpu_topology,disk,hugetlb,memory_numa,percpu,perf_event,referenced_memory,resctrl,sched,tcp,udp
    volumes: [/:/rootfs:ro, /sys:/sys:ro, /var/lib/docker:/var/lib/docker:ro, /dev/disk:/dev/disk:ro, /run/containerd:/run/containerd:ro]
    depends_on: [docker-socket-proxy]
  node-exporter:
    <<: *monitor
    image: prom/node-exporter:v1.12.1
    mem_limit: 32m
    cpus: 0.2
    pid: host
    command: [--path.rootfs=/host, --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|run/docker/.+)($|/)]
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind: {propagation: rslave}
  postgres-monitor-init:
    image: postgres:17
    restart: 'no'
    mem_limit: 32m
    networks: [default]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD:?}
    entrypoint: [psql, -v, ON_ERROR_STOP=1, -f, /init.sql]
    volumes: [./monitoring/postgres-init.sql:/init.sql:ro]
    depends_on:
      postgres: {condition: service_healthy}
    logging: *logging
  postgres-exporter:
    <<: *monitor
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    mem_limit: 48m
    cpus: 0.2
    networks: [monitoring, default]
    environment:
      DATA_SOURCE_USER: worlds_monitor
      DATA_SOURCE_PASS: ${POSTGRES_MONITOR_PASSWORD:?}
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:?}?sslmode=disable
    depends_on:
      postgres-monitor-init: {condition: service_completed_successfully}
  blackbox:
    <<: *monitor
    image: prom/blackbox-exporter:v0.29.1
    mem_limit: 32m
    cpus: 0.2
    command: [--config.file=/etc/blackbox/config.yml]
    volumes: [./monitoring/blackbox.yml:/etc/blackbox/config.yml:ro]
networks:
  monitoring:
  docker-observer:
    internal: true
volumes:
  grafana_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
  alloy_data:
